<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles/reset.css">
  <link rel="stylesheet" href="styles/style.css">
  <title>Document</title>
</head>

<body>

  <div class="buttons">
    <button id="change-color-button" class="color-button">Я умею менять цвет</button>
    <button id="recolor-first-card-button">Перекрасить фон первой карточки</button>
    <button id="recolor-all-cards-button">Перекрасить фон всех карточек</button>
    <button id="open-google-button">Открыть страницу Google</button>
  </div>
  <div class="main-parrent">
    <img src="images/bg-main.png" alt="" class="bg-image">
    <h1 class="products-title">Выбери свой продукт</h1>
    <div id="products-list"></div>
    <!-- тег для сохранения продуктов "product-list" я изначально сделал "ul", но карточки не отображались
     перезаписал на "div", всё работает, но хотелось бы разобраться почему не работало со списками "ul" -->
    
     <!-- 3. По аналогии из лекции — создать и реализовать шаблон для продуктовых карточек. -->
    <template id="product-card-template">
      <div class="product-card">
        <img class="product-card__img">
        <p class="product-card__label"></p>
        <h3 class="product-card__title"></h3>
        <p class="product-card__description"></p>
        <span class="product-card__text">Состав:</span>
        <ul class="product-card__composition" type="circle"></ul>
        <div class="product-card__price-wrapper">
          <h3 class="product-card__price-text">Цена</h3>
          <h3 class="product-card__price"></h3>
        </div>
      </div>
    </template>
  </div>
  <script src="script.js"></script>
  <script src="homework-5.js"></script>
  <script src="homework-6.js"></script>
  <script src="comments.js" type="module"></script>
  <script src="homework-7.js" type="module"></script>
  <script src="homework-8.js" type="module"></script>
</body>

</html>
